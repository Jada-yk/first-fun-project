<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ja-da</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Indie+Flower&family=Poppins:wght@400;500&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: url(/background.png);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
      overflow-y: auto;
    }

    /* ---------- layout ---------- */
    .container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
      width: 90%;
      min-height: 80vh;
      margin: 40px auto;
      padding: clamp(20px, 6vw, 100px);
      background-color: #fff;
    }

    .side-left {
      container-type: inline-size;   /* lets the stage size itself from this column's width */
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      flex: 1;
      min-width: 0;
    }

    .side-right {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ---------- curtain stage ---------- */
    .stage {
      --photo: min(350px, 60cqw, 70vw);      /* photo diameter */
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding-bottom: 46px;                  /* room for the hint pill */
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* the circle photo */
    .photo {
      position: relative;
      z-index: 1;
      flex: none;
      width: var(--photo);
      height: var(--photo);
      border-radius: 50%;
      overflow: hidden;                      /* clips the closed curtains to the circle */
      background: #ffe3ef;
    }
    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* closed curtains (pleated pink panels) */
    .panel {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50.5%;
      background:
        linear-gradient(to bottom, rgba(255,255,255,.35), transparent 28%, transparent 70%, rgba(236,79,143,.28)),
        repeating-linear-gradient(90deg, #ff9fc8 0, #ffd0e4 11px, #ff9fc8 22px);
      transition: transform .8s cubic-bezier(.65, 0, .35, 1), opacity .6s ease;
    }
    .panel-l { left: 0;  border-right: 2px solid #ec4f8f; }
    .panel-r { right: 0; border-left: 2px solid #ec4f8f; }

    /* opening: the pink curtain slides apart, fading out as it goes */
    .stage.open .panel {
      opacity: 0;
      transition: transform .9s cubic-bezier(.65, 0, .35, 1), opacity .6s ease .35s;
    }
    .stage.open .panel-l { transform: translateX(-70%); }
    .stage.open .panel-r { transform: translateX(70%); }

    /* your cartoon curtains: each image is cropped to just the drape, hugging the photo */
    .cur {
      position: relative;
      z-index: 2;
      flex: none;
      height: calc(var(--photo) * 1.05);
      width: calc(var(--photo) * 0.42);
      object-fit: cover;
      opacity: 0;
      transition: transform .9s cubic-bezier(.65, 0, .35, 1), opacity .7s ease .15s;
      pointer-events: none;
    }
    .cur-l { object-position: left center;  margin-right: calc(var(--photo) * -0.05); transform: translateX(45%); }
    .cur-r { object-position: right center; margin-left:  calc(var(--photo) * -0.05); transform: translateX(-45%); }
    .stage.open .cur { opacity: 1; transform: none; }

    /* hint pill */
    .hint {
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      background: #fff0f6;
      border: 1px solid #ffb3d1;
      color: #d63384;
      font-size: 12px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity .25s ease;
      pointer-events: none;
    }
    .hint svg {
      width: 14px;
      height: 14px;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .hint .ico-close { display: none; }
    .stage.open .hint .ico-spark { display: none; }
    .stage.open .hint .ico-close { display: inline; }

    .stage:not(.open) .hint { opacity: 1; animation: hint-pulse 1.8s ease-in-out infinite; }
    .stage.open:hover .hint,
    .stage.open:focus-visible .hint { opacity: 1; }
    @keyframes hint-pulse {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50%      { transform: translateX(-50%) scale(1.07); }
    }

    /* ---------- text + button ---------- */
    .text {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .text p {
      font-size: 20px;
      font-family: 'Indie Flower', cursive;
    }

    .button {
      background-color: #8FA394;
      border: none;
      color: white;
      border-radius: 10px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 20px;
    }
    .button:hover { background-color: #6B7A8F; }

    .character img {
      position: absolute;
      bottom: 0;
      right: 0;
      max-height: 90%;
      width: auto;
    }

    /* ---------- music player (horizontal) ---------- */
    .vp,
    .vp * {
      font-family: Georgia, "Times New Roman", serif;
    }

    .vp {
      --vp-color: #494F99;
      width: 100%;
      max-width: 300px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px 12px 12px;
      border-radius: 22px;
      background: var(--vp-color);
      color: #fff;
      box-shadow: 0 8px 18px rgba(73, 79, 153, 0.35);
    }

    .vp-disc-wrap {
      position: relative;
      flex: 0 0 84px;
      width: 84px;
      height: 84px;
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
    }
    .vp-disc {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background:
        radial-gradient(circle, transparent 0 34%, rgba(0,0,0,.5) 35% 38%, transparent 39%),
        repeating-radial-gradient(circle, #0b0b0b 0 1px, #151515 2px 3px);
      display: grid;
      place-items: center;
      animation: vp-spin 4s linear infinite;
      animation-play-state: paused;
    }
    .vp-disc.spinning { animation-play-state: running; }
    .vp-label {
      width: 34%;
      height: 34%;
      border-radius: 50%;
      background: #e8e8e8;
      box-shadow: inset 0 0 0 2px #f4f4f4;
      position: relative;
    }
    .vp-label::after {
      content: "";
      position: absolute;
      inset: 0;
      margin: auto;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--vp-color);
    }
    .vp-disc-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      pointer-events: none;
      background: conic-gradient(
        from 0deg,
        transparent 0 18%, rgba(255,255,255,.22) 25%, transparent 32%,
        transparent 68%, rgba(255,255,255,.22) 75%, transparent 82%
      );
    }
    @keyframes vp-spin { to { transform: rotate(360deg); } }

    .vp-main { flex: 1; min-width: 0; }
    .vp-title {
      font-size: 13px;
      font-style: italic;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .vp-artist {
      font-size: 9px;
      opacity: 0.7;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      margin: 2px 0 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .vp-range {
      --pct: 0%;
      -webkit-appearance: none;
      appearance: none;
      display: block;
      width: 100%;
      height: 3px;
      border-radius: 3px;
      outline: none;
      cursor: pointer;
      background: linear-gradient(to right, #fff var(--pct), rgba(255,255,255,.3) var(--pct));
    }
    .vp-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #fff;
    }
    .vp-range::-moz-range-thumb {
      width: 8px; height: 8px;
      border: 0;
      border-radius: 50%;
      background: #fff;
    }
    .vp-times {
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      opacity: 0.7;
      margin-top: 4px;
    }

    .vp-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 22px;
      margin-top: 4px;
    }
    .vp-controls button {
      background: none;
      border: 0;
      padding: 0;
      margin: 0;
      color: #fff;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform .15s ease, opacity .15s ease;
    }
    .vp-controls button:hover { transform: scale(1.12); opacity: .85; }

    /* ---------- responsive ---------- */
    img { max-width: 100%; }
    .cur { max-width: none; }

    @media (max-width: 900px) {
      body { background-attachment: scroll; }

      .container {
        flex-direction: column;
        width: 94%;
        min-height: auto;
        margin: 20px auto;
        gap: 32px;
      }
      .side-left,
      .side-right { width: 100%; align-items: center; }

      .text { text-align: center; }

      .character img {
        position: static;
        display: block;
        margin: 24px auto 0;
        max-width: 70%;
        max-height: 300px;
      }
    }

    @media (max-width: 480px) {
      .text p { font-size: 18px; }
      .button { width: 100%; }

      .vp { gap: 10px; padding: 10px 12px 10px 10px; }
      .vp-disc-wrap { flex-basis: 70px; width: 70px; height: 70px; }
      .vp-controls { gap: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .panel, .cur { transition-duration: .01s; }
      .stage:not(.open) .hint { animation: none; }
    }
  </style>
</head>

<body>
  <div class="container">

    <aside class="side-left">

      <!-- curtain stage: click to open / close -->
      <div class="stage" id="stage" role="button" tabindex="0" aria-expanded="false"
           aria-label="Click the curtains to open or close them">

        <img class="cur cur-l" src="/curtain_left.png" alt="">

        <div class="photo">
          <img src="/me.png" alt="Me">
          <span class="panel panel-l"></span>
          <span class="panel panel-r"></span>
        </div>

        <img class="cur cur-r" src="/curtain_right.png" alt="">

        <span class="hint" id="stageHint">
          <!-- sparkle icon (curtains closed) -->
          <svg class="ico-spark" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/>
            <path d="M19 16v4M17 18h4"/>
          </svg>
          <!-- close icon (curtains open) -->
          <svg class="ico-close" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
          <span id="stageHintText">click the curtains to open</span>
        </span>
      </div>

      <!-- music player -->
      <div class="vp">
        <div class="vp-disc-wrap">
          <div class="vp-disc" id="vpDisc"><div class="vp-label"></div></div>
        </div>

        <div class="vp-main">
          <div class="vp-title" id="vpTitle">Loading…</div>
          <div class="vp-artist" id="vpArtist">&nbsp;</div>

          <input type="range" class="vp-range" id="vpSeek" min="0" max="100" step="0.1" value="0">
          <div class="vp-times"><span id="vpCur">0:00</span><span id="vpRem">-0:00</span></div>

          <div class="vp-controls">
            <button id="vpPrev" aria-label="Previous">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M11 6v12L2 12zM22 6v12l-9-6z"/></svg>
            </button>
            <button id="vpPlay" aria-label="Play / Pause">
              <svg id="vpPlayIcon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M7 4h4v16H7zM13 4h4v16h-4z" style="display:none"/><path d="M7 4l13 8-13 8z"/></svg>
            </button>
            <button id="vpNext" aria-label="Next">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M13 6v12l9-6zM2 6v12l9-6z"/></svg>
            </button>
          </div>
        </div>

        <audio id="vpAudio" preload="none"></audio>
      </div>
    </aside>

    <aside class="side-right">
      <div class="text">
        <p>hey i’m ja-da and this is the first project i ever uploaded to github</p>
      </div>

      <button class="button" id="party">continue my journey with me</button>

      <div class="character">
        <img src="/img.png" alt="Character">
      </div>
    </aside>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script>
    /* ---------- confetti button ---------- */
    document.getElementById("party").addEventListener("click", () => {
      confetti({ particleCount: 120, spread: 70, origin: { y: 0.6 } });
    });

    /* ---------- curtains ---------- */
    (() => {
      const stage = document.getElementById("stage");
      const hintText = document.getElementById("stageHintText");

      function toggle() {
        const open = stage.classList.toggle("open");
        stage.setAttribute("aria-expanded", open);
        hintText.textContent = open ? "click to close the curtains" : "click the curtains to open";
      }

      stage.addEventListener("click", toggle);
      stage.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
      });
    })();

    /* ---------- music player ---------- */
    (() => {
      // Mixed on purpose: Afrobeats / Nigerian favourites alongside a few others, artists alternate.
      // Edit any line to change a song (add the artist name so it finds the right version).
      const playlist = [
        "Rush Ayra Starr",
        "Strangers Kenya Grace",
        "Free Mind Tems",
        "From the Start Laufey",
        "Calm Down Rema",
        "Golden Hour JVKE",
        "Last Last Burna Boy",
        "Boy's a liar Pt. 2 PinkPantheress",
        "love nwantiti CKay",
        "Sability Ayra Starr",
        "Essence Wizkid Tems",
        "Valentine Laufey",
        "Soso Omah Lay",
        "this is what falling in love feels like JVKE",
        "Terminator Asake",
        "Pain PinkPantheress",
        "Higher Tems",
        "Bloody Samaritan Ayra Starr",
        "Peru Fireboy DML",
        "Bewitched Laufey",
        "Sungba Asake",
        "upside down JVKE",
        "Understand Omah Lay",
        "Break It Off PinkPantheress",
        "Commas Ayra Starr",
        "Snooze SZA",
        "Ye Burna Boy",
        "Dreamer Laufey",
        "Love Me Jeje Tems",
        "Away Ayra Starr",
        "Glimpse of Us Joji",
        "Beggie Beggie Ayra Starr",
        "Water Tyla",
        "her JVKE",
        "Mosquito PinkPantheress",
        "Falling Behind Laufey",
        "Joha Asake",
        "Last Heartbreak Song Ayra Starr",
        "Coffee Beabadoobee",
      ];

      const $ = id => document.getElementById(id);
      const audio = $("vpAudio"), disc = $("vpDisc"), seek = $("vpSeek");
      const pauseP = $("vpPlayIcon").children[0], playP = $("vpPlayIcon").children[1];
      let i = 0, token = 0;

      const fmt = s => isFinite(s) ? Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0") : "0:00";
      const fill = v => seek.style.setProperty("--pct", v + "%");

      async function load(n, autoplay) {
        i = (n + playlist.length) % playlist.length;
        const me = ++token;
        $("vpTitle").textContent = "Loading…";
        $("vpArtist").innerHTML = "&nbsp;";
        seek.value = 0; fill(0);
        $("vpCur").textContent = "0:00"; $("vpRem").textContent = "-0:00";
        try {
          const url = "https://itunes.apple.com/search?media=music&entity=song&limit=1&term=" +
                      encodeURIComponent(playlist[i]);
          const data = await (await fetch(url)).json();
          if (me !== token) return;
          const t = data.results[0];
          if (!t || !t.previewUrl) throw new Error("no preview");
          audio.src = t.previewUrl;
          $("vpTitle").textContent = t.trackName;
          $("vpArtist").textContent = t.artistName;
          if (autoplay) audio.play().then(() => setPlaying(true)).catch(() => setPlaying(false));
        } catch (e) {
          if (me !== token) return;
          $("vpTitle").textContent = "Couldn't load song";
          $("vpArtist").textContent = playlist[i];
        }
      }

      function setPlaying(on) {
        disc.classList.toggle("spinning", on);
        pauseP.style.display = on ? "" : "none";
        playP.style.display = on ? "none" : "";
      }

      audio.addEventListener("play",    () => setPlaying(true));
      audio.addEventListener("playing", () => setPlaying(true));
      audio.addEventListener("pause",   () => setPlaying(false));
      audio.addEventListener("emptied", () => setPlaying(false));
      audio.addEventListener("error",   () => setPlaying(false));
      audio.addEventListener("ended", () => { setPlaying(true); load(i + 1, true); });
      audio.addEventListener("timeupdate", () => {
        if (!audio.duration) return;
        seek.value = (audio.currentTime / audio.duration) * 100;
        fill(seek.value);
        $("vpCur").textContent = fmt(audio.currentTime);
        $("vpRem").textContent = "-" + fmt(audio.duration - audio.currentTime);
      });
      seek.addEventListener("input", () => {
        if (audio.duration) audio.currentTime = (seek.value / 100) * audio.duration;
        fill(seek.value);
      });

      $("vpPlay").onclick = () => {
        if (!audio.src) { load(i, true); return; }
        audio.paused ? audio.play().then(() => setPlaying(true)).catch(() => setPlaying(false)) : audio.pause();
      };
      $("vpNext").onclick = () => load(i + 1, !audio.paused);
      $("vpPrev").onclick = () => load(i - 1, !audio.paused);

      load(0, false);
    })();
  </script>
</body>

</html>
